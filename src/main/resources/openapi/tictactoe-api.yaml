openapi: 3.0.3
info:
  title: Tic Tac Toe API
  version: 1.0.0
  description: Contract-first Tic Tac Toe API

paths:
  /games:
    post:
      tags:
        - Game
      operationId: createGame
      summary: Create a new game
      responses:
        '201':
          description: Game created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'

  /games/{gameId}/moves:
    post:
      tags:
        - Game
      operationId: makeMove
      summary: Make a move in a game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
        - name: position
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 8
      responses:
        '200':
          description: Move accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
        '400':
          description: Invalid move
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    GameResponse:
      type: object
      properties:
        gameId:
          type: string
        currentPlayer:
          type: string
      required:
        - gameId
        - currentPlayer

    MoveResponse:
      type: object
      properties:
        board:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum:
            - IN_PROGRESS
            - X_WINS
            - O_WINS
            - DRAW
      required:
        - board
        - status

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
      required:
        - message
        - error